<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a73e8">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مساحتي">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>مساحتي — ملفات HTML</title>
<style>
:root{--bg:#f6f8fc;--surface:#fff;--surface2:#f0f3f8;--line:#e2e6ee;--text:#202124;--muted:#68717f;--blue:#1a73e8;--blue-soft:#e8f0fe;--shadow:0 1px 3px #20212418;--radius:16px}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--text);font-family:Arial,"Noto Sans Arabic",system-ui,sans-serif;overflow:hidden}
button,input,textarea{font:inherit}button{border:0;cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #8ab4f8;outline-offset:2px}
.app{height:100dvh;display:grid;grid-template-rows:66px 1fr;grid-template-columns:248px 1fr}
.mobile-navbtn{display:none}.topbar{grid-column:1/-1;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 22px;z-index:3}
.brand{display:flex;align-items:center;gap:12px;min-width:220px}.brandmark{width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,#4285f4,#1967d2);color:#fff;display:grid;place-items:center;font-size:20px;font-weight:700}.brandname{font-size:19px;font-weight:600;letter-spacing:-.3px}
.searchbox{height:44px;max-width:720px;flex:1;background:#f1f3f4;border-radius:24px;display:flex;align-items:center;gap:10px;padding:0 17px;color:var(--muted)}.searchbox input{border:0;outline:0;background:transparent;width:100%;color:var(--text);font-size:15px}
.topright{display:flex;align-items:center;gap:8px;margin-right:auto}.iconbtn{width:40px;height:40px;border-radius:50%;background:transparent;color:#5f6368;font-size:19px;display:grid;place-items:center}.iconbtn:hover{background:var(--surface2)}.avatar{width:34px;height:34px;border-radius:50%;background:#d3e3fd;color:#174ea6;display:grid;place-items:center;font-weight:700}
.sidebar{background:#f8fafd;padding:18px 12px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:15px;min-height:0}
.newbtn{height:52px;align-self:flex-start;border-radius:16px;background:#fff;padding:0 19px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 4px #0002;font-weight:600}.newplus{font-size:25px;font-weight:300;color:var(--blue)}
.nav{display:flex;flex-direction:column;gap:4px}.navitem{height:42px;border-radius:22px;display:flex;align-items:center;gap:13px;padding:0 16px;color:#454a52;text-align:right;background:transparent;font-size:14px}.navitem.active{background:#d3e3fd;color:#174ea6;font-weight:600}.navitem .ni{font-size:18px;width:20px;text-align:center}
.sidehint{margin-top:auto;padding:12px 13px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.8}
.content{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--surface)}
.contenthead{padding:18px 28px 12px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.heading{min-width:0}.heading h1{font-size:23px;font-weight:500;margin:0 0 9px}.crumbs{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:13px;white-space:nowrap;overflow:auto}.crumb{background:transparent;color:var(--muted);padding:2px}.crumb:hover{color:var(--blue)}.crumb.current{color:var(--text);font-weight:600}
.headactions{display:flex;align-items:center;gap:8px;flex-shrink:0}.sortselect{border:1px solid var(--line);background:white;border-radius:9px;padding:9px 11px;color:#4c535e}
.primary{background:var(--blue);color:white;border-radius:22px;padding:11px 18px;font-weight:600}.primary:hover{background:#1765cc}.softbtn{background:var(--blue-soft);color:#174ea6;border-radius:20px;padding:10px 15px;font-weight:600}
.contentbody{padding:8px 28px 25px;overflow:auto;min-height:0;flex:1}
.sectionlabel{font-size:13px;font-weight:600;color:#5f6368;margin:13px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:12px}
.item{position:relative;border:1px solid var(--line);border-radius:12px;background:#fff;min-height:72px;display:flex;align-items:center;gap:12px;padding:12px;cursor:pointer;transition:.12s;min-width:0}
.item:hover{background:#f8fafd;border-color:#c7d7f5;box-shadow:var(--shadow)}.item[draggable="true"]{cursor:grab}.item[draggable="true"]:active{cursor:grabbing}.item.selected{background:#e8f0fe;border-color:#8ab4f8}
.itemicon{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;font-size:22px;flex-shrink:0}.foldericon{background:#e8f0fe;color:#4285f4}.fileicon{background:#e6f4ea;color:#188038}
.itemmeta{min-width:0;flex:1}.itemname{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.itemsub{font-size:11px;color:var(--muted);margin-top:5px}.more{width:30px;height:30px;border-radius:50%;background:transparent;color:#68717f;font-size:18px}.more:hover{background:#e9edf4}
.empty{border:1px dashed #cbd2de;border-radius:16px;padding:55px 20px;text-align:center;color:var(--muted);margin-top:12px}.emptyicon{font-size:42px;margin-bottom:10px}.empty strong{display:block;color:#444b55;margin-bottom:7px}
.listview{display:flex;flex-direction:column;gap:4px}.listview .item{min-height:58px;border-radius:9px}
.context{position:fixed;z-index:20;background:white;border:1px solid var(--line);box-shadow:0 8px 30px #0002;border-radius:12px;padding:6px;min-width:175px;display:none}.context button{width:100%;text-align:right;padding:10px;border-radius:8px;background:transparent;font-size:13px}.context button:hover{background:#f1f3f4}
.modalback{position:fixed;inset:0;background:#20212466;z-index:30;display:none;align-items:center;justify-content:center;padding:18px}.modal{background:white;color:var(--text);border-radius:18px;width:min(440px,100%);padding:22px;box-shadow:0 12px 40px #0003}.modal h3{margin:0 0 16px;font-size:18px}.modal input{width:100%;padding:12px;border:1px solid #c8cdd5;border-radius:9px;outline:0}.modalactions{display:flex;justify-content:flex-start;gap:8px;margin-top:18px}
.viewer{position:fixed;inset:0;background:#fff;z-index:10;display:none;flex-direction:column}
.viewbar{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 15px;flex-shrink:0}
.backbtn{width:38px;height:38px;border-radius:50%;background:transparent;font-size:20px}.backbtn:hover{background:#f1f3f4}.viewtitle{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.viewtools{display:flex;gap:6px}.viewtools button{background:#f1f3f4;border-radius:9px;padding:9px 12px;font-size:13px}.viewtools button.active{background:#d3e3fd;color:#174ea6}
.viewstage{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr}.viewstage.preview-only{grid-template-columns:1fr}.viewstage.code-only{grid-template-columns:1fr}.viewstage.code-only .renderpane,.viewstage.preview-only .codepane{display:none}
.renderpane{min-width:0;min-height:0;background:#fff}.renderpane iframe{width:100%;height:100%;border:0;background:white}.codepane{min-width:0;min-height:0;background:#17191e;display:flex;flex-direction:column;border-right:1px solid var(--line)}
.codehead{height:39px;color:#adb3c1;padding:10px 15px;font-size:12px;border-bottom:1px solid #30343d}.codearea{flex:1;min-height:0;width:100%;resize:none;border:0;outline:0;background:#17191e;color:#d8deeb;padding:16px;direction:ltr;text-align:left;font:13px/1.65 ui-monospace,Consolas,monospace;white-space:pre;tab-size:2}
.viewfoot{height:28px;background:#f8f9fa;border-top:1px solid var(--line);font-size:11px;color:var(--muted);display:flex;align-items:center;justify-content:space-between;padding:0 12px}
.toast{position:fixed;z-index:50;bottom:22px;left:50%;transform:translateX(-50%);background:#30343b;color:white;padding:11px 17px;border-radius:22px;font-size:13px;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1}
@media(max-width:800px){
 .app{grid-template-columns:1fr;grid-template-rows:58px 1fr}.topbar{padding:0 12px;gap:10px}.brand{min-width:auto}.brandname{font-size:16px}.searchbox{height:39px}.topright .hide-mobile{display:none}
 .sidebar{display:none}.mobile-navbtn{display:grid}.sidebar.mobile-open{display:flex;position:fixed;z-index:25;top:58px;bottom:0;right:0;width:min(82vw,290px);box-shadow:-8px 0 30px #0002}.contenthead{padding:15px 15px 9px;align-items:flex-start;flex-direction:column}.heading h1{font-size:21px}.headactions{width:100%;justify-content:space-between}.contentbody{padding:5px 14px 20px}.grid{grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:9px}.item{padding:10px;gap:9px;min-height:67px}.itemicon{width:37px;height:37px}
 .viewbar{height:55px;padding:0 8px;gap:5px}.viewtools{gap:3px}.viewtools button{padding:8px;font-size:12px}.viewstage{grid-template-columns:1fr;grid-template-rows:1fr 1fr}.viewstage .renderpane{grid-row:1}.viewstage .codepane{grid-row:2;border-right:0;border-top:1px solid var(--line)}.viewstage.preview-only{grid-template-rows:1fr}.viewstage.code-only{grid-template-rows:1fr}
}
</style>
</head>
<body>
<div class="app" id="app">
<header class="topbar">
 <button class="iconbtn mobile-navbtn" id="mobileNav" aria-label="القائمة">☰</button><div class="brand"><div class="brandmark">▱</div><div class="brandname">مساحتي</div></div>
 <label class="searchbox"><span>⌕</span><input id="search" placeholder="ابحث في الملفات والمجلدات"></label>
 <div class="topright"><button class="iconbtn hide-mobile" id="viewToggle" title="تبديل العرض">☷</button><button class="iconbtn" id="importTop" title="استيراد ملف">↥</button><div class="avatar">م</div></div>
 <input id="filePicker" type="file" accept=".html,.htm,.txt" hidden><input id="restorePicker" type="file" accept=".json,application/json" hidden>
</header>
<aside class="sidebar">
 <div style="position:relative"><button class="newbtn" id="newMenu"><span class="newplus">＋</span> جديد</button><div id="newMenuPopup" class="context" style="top:58px;right:0;left:auto"><button id="newFolderMenu">📁　مجلد جديد</button><button id="newFileMenu">🌐　ملف HTML جديد</button><button id="importMenu">↥　استيراد ملف HTML</button><button id="backupMenu">⇩　نسخة احتياطية (تصدير)</button><button id="restoreMenu">⇧　استعادة نسخة احتياطية</button><button id="installMenu" style="display:none">⊕　تثبيت التطبيق</button></div></div>
 <nav class="nav">
  <button class="navitem active" id="homeNav"><span class="ni">⌂</span> ملفاتي</button>
  <button class="navitem" id="recentNav"><span class="ni">◷</span> الأخيرة</button>
  <button class="navitem" id="starNav"><span class="ni">☆</span> المميزة</button>
 </nav>
 <div class="sidehint">مساحة محلية لملفات HTML<br>اضغط مرة واحدة لفتح أي مجلد أو صفحة. اسحب العناصر إلى المجلدات أو استخدم «نقل إلى مجلد».</div>
</aside>
<main class="content">
 <div class="contenthead">
  <div class="heading"><h1 id="pageHeading">ملفاتي</h1><div class="crumbs" id="breadcrumbs"></div></div>
  <div class="headactions"><select class="sortselect" id="sort"><option value="name">ترتيب حسب الاسم</option><option value="date">الأحدث أولاً</option><option value="type">النوع</option></select><button class="softbtn" id="newFolder">＋ مجلد جديد</button><button class="primary" id="newFile">＋ ملف HTML</button></div>
 </div>
 <div class="contentbody"><div class="sectionlabel" id="sectionLabel">المحتويات</div><div id="items" class="grid"></div><div class="empty" id="empty" hidden><div class="emptyicon">📂</div><strong>هذا المجلد فارغ</strong><span>أنشئ مجلداً أو ملف HTML لتبدأ.</span></div></div>
</main>
</div>
<div class="viewer" id="viewer">
 <div class="viewbar">
  <button class="backbtn" id="closeViewer" title="العودة">→</button>
  <div class="viewtitle" id="viewTitle">صفحة HTML</div>
  <div class="viewtools">
   <button id="showPreview" class="active">الصفحة</button><button id="showCode">الكود</button><button id="showSplit">تقسيم</button>
   <button id="saveCode">حفظ</button><button id="exportOpen">تصدير</button>
  </div>
 </div>
 <div class="viewstage preview-only" id="viewStage">
  <div class="renderpane"><iframe id="renderFrame" sandbox="allow-scripts allow-forms allow-modals allow-popups"></iframe></div>
  <div class="codepane"><div class="codehead">محرر HTML</div><textarea class="codearea" id="openCode" spellcheck="false" autocapitalize="off"></textarea></div>
 </div>
 <div class="viewfoot"><span id="viewStatus">عرض الصفحة</span><span>مساحتي · معاينة HTML</span></div>
</div>
<div class="context" id="context"></div>
<div class="modalback" id="modalBack"><div class="modal"><h3 id="modalTitle">إنشاء مجلد</h3><input id="modalInput" placeholder="اكتب الاسم"><select id="folderDestination" style="display:none;width:100%;margin-top:12px;padding:12px;border:1px solid #c8cdd5;border-radius:9px;background:white;color:#202124"></select><div class="modalactions"><button class="primary" id="modalOk">إنشاء</button><button id="modalCancel">إلغاء</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
(()=>{
const KEY='masahati-drive-v1';let data=[],folder='root',opened=null,view='preview',mode='files',list=false,contextTarget=null,modalAction=null;
const $=id=>document.getElementById(id);
const starter=`<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>صفحتي</title>
<style>body{font-family:system-ui;background:#f4f6fb;display:grid;place-items:center;min-height:100vh;margin:0;color:#25283a}.card{background:white;padding:35px;border-radius:22px;box-shadow:0 12px 35px #24345a18;text-align:center;max-width:420px}button{background:#1a73e8;color:white;border:0;border-radius:10px;padding:12px 18px}</style></head>
<body><main class="card"><h1>مرحباً بك 👋</h1><p>هذه صفحة HTML داخل مساحتي.</p><button onclick="document.querySelector('p').textContent='كل شيء يعمل!'">جرّب الزر</button></main></body></html>`;
function id(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){notify('تعذر الحفظ: مساحة المتصفح ممتلئة');return false}}
function notify(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function children(parent){return data.filter(x=>x.parent===parent)}
function byId(x){return data.find(y=>y.id===x)}
function pathOf(fid){let a=[],f=byId(fid);while(f){a.unshift(f);f=f.parent==='root'?null:byId(f.parent)}return a}
function render(){
 const q=$('search').value.trim().toLowerCase();let arr;
 if(mode==='recent')arr=[...data].sort((a,b)=>b.updated-a.updated).slice(0,30);
 else if(mode==='star')arr=data.filter(x=>x.star);
 else arr=children(folder);
 if(q)arr=data.filter(x=>x.name.toLowerCase().includes(q));
 const sort=$('sort').value;arr.sort((a,b)=>sort==='date'?b.updated-a.updated:sort==='type'?(a.type+a.name).localeCompare(b.type+b.name):a.name.localeCompare(b.name,'ar'));
 $('pageHeading').textContent=mode==='recent'?'الأخيرة':mode==='star'?'المميزة':folder==='root'?'ملفاتي':(byId(folder)?.name||'ملفاتي');
 $('breadcrumbs').innerHTML='';
 if(mode==='files'){let root=document.createElement('button');root.className='crumb'+(folder==='root'?' current':'');root.textContent='ملفاتي';root.onclick=()=>{folder='root';render()};$('breadcrumbs').append(root);
 pathOf(folder).forEach((f,i,a)=>{let sep=document.createElement('span');sep.textContent='›';$('breadcrumbs').append(sep);let b=document.createElement('button');b.className='crumb'+(i===a.length-1?' current':'');b.textContent=f.name;b.onclick=()=>{folder=f.id;render()};$('breadcrumbs').append(b)})}
 $('sectionLabel').textContent=arr.length+' عنصر';
 $('items').className=list?'listview':'grid';$('items').innerHTML='';
 arr.forEach(item=>{
  const el=document.createElement('div');el.className='item';el.dataset.id=item.id;
  const ic=document.createElement('div');ic.className='itemicon '+(item.type==='folder'?'foldericon':'fileicon');ic.textContent=item.type==='folder'?'📁':'🌐';
  const meta=document.createElement('div');meta.className='itemmeta';const name=document.createElement('div');name.className='itemname';name.textContent=item.name;const sub=document.createElement('div');sub.className='itemsub';sub.textContent=item.type==='folder'?(children(item.id).length+' عنصر'):'HTML · '+new Date(item.updated).toLocaleDateString('ar');meta.append(name,sub);
  const more=document.createElement('button');more.className='more';more.textContent='⋮';more.title='خيارات';more.onclick=e=>{e.stopPropagation();showContext(e.clientX,e.clientY,item.id)};
  el.append(ic,meta,more);el.onclick=()=>openItem(item);
  $('items').append(el);
 });
 $('empty').hidden=arr.length!==0;
}
function add(type,name,parent=folder,code=''){
 const item={id:id(),type,name,parent,code,updated:Date.now(),star:false};data.push(item);save();render();return item;
}
function openItem(item){if(item.type==='folder'){folder=item.id;mode='files';render()}else openFile(item.id)}
function openFile(fid){if(opened&&opened!==fid)saveOpened(false);opened=fid;const f=byId(fid);if(!f)return;$('viewTitle').textContent=f.name;$('openCode').value=f.code;run();setView('preview');$('viewer').style.display='flex'}
function run(){$('renderFrame').srcdoc=$('openCode').value;$('viewStatus').textContent='تم تحديث المعاينة'}
function setView(v){view=v;$('viewStage').className='viewstage '+(v==='preview'?'preview-only':v==='code'?'code-only':'');$('showPreview').classList.toggle('active',v==='preview');$('showCode').classList.toggle('active',v==='code');$('showSplit').classList.toggle('active',v==='split');if(v!=='code')run();$('viewStatus').textContent=v==='preview'?'عرض الصفحة':v==='code'?'عرض الكود':'الكود والمعاينة'}
function saveOpened(show=true){const f=byId(opened);if(!f)return;f.code=$('openCode').value;f.updated=Date.now();save();render();if(show)notify('تم حفظ الملف')}
function exportOpened(){const f=byId(opened);if(!f)return;const blob=new Blob([$('openCode').value],{type:'text/html;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=f.name.endsWith('.html')?f.name:f.name+'.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function showModal(title,placeholder,action){modalAction=action;$('modalTitle').textContent=title;$('modalInput').style.display='block';$('folderDestination').style.display='none';$('modalOk').textContent='إنشاء';$('modalInput').placeholder=placeholder;$('modalInput').value='';$('modalBack').style.display='flex';setTimeout(()=>$('modalInput').focus(),50)}
function closeModal(){$('modalBack').style.display='none';$('modalInput').style.display='block';$('folderDestination').style.display='none';$('modalOk').textContent='إنشاء';$('modalOk').onclick=modalOk}
function modalOk(){const name=$('modalInput').value.trim();if(!name){notify('اكتب اسماً أولاً');return}modalAction?.(name);closeModal()}
function showContext(x,y,fid){contextTarget=fid;const f=byId(fid);const c=$('context');c.innerHTML='';const opts=[['نقل إلى مجلد…',()=>showMoveDialog(f)],['إعادة تسمية',()=>showModal('إعادة تسمية','الاسم الجديد',n=>{f.name=n;f.updated=Date.now();save();render()} )],['تمييز بنجمة',()=>{f.star=!f.star;save();render();notify(f.star?'أضيف إلى المميزة':'أزيل من المميزة')}],['تنزيل HTML',()=>{if(f.type==='file'){opened=f.id;exportOpened()}else notify('يمكنك فتح ملفات المجلد وتنزيلها')}],['حذف',()=>removeItem(f.id)]];
 opts.forEach(([label,fn])=>{const b=document.createElement('button');b.textContent=label;b.onclick=()=>{c.style.display='none';fn()};c.append(b)});
 c.style.display='block';c.style.left=Math.min(x,innerWidth-190)+'px';c.style.top=Math.min(y,innerHeight-220)+'px';
}
function showMoveDialog(item){
 const select=$('folderDestination');select.innerHTML='';
 const rootOpt=document.createElement('option');rootOpt.value='root';rootOpt.textContent='ملفاتي (الرئيسية)';select.append(rootOpt);
 const descendants=new Set();
 if(item.type==='folder'){
  const stack=[item.id];
  while(stack.length){const cur=stack.pop();descendants.add(cur);data.filter(x=>x.parent===cur&&x.type==='folder').forEach(x=>stack.push(x.id))}
 }
 function addFolders(parent,depth){
  data.filter(x=>x.type==='folder'&&x.parent===parent&& !descendants.has(x.id)).sort((a,b)=>a.name.localeCompare(b.name,'ar')).forEach(f=>{
   const opt=document.createElement('option');opt.value=f.id;opt.textContent='　'.repeat(depth)+'📁 '+f.name;select.append(opt);addFolders(f.id,depth+1);
  });
 }
 addFolders('root',0);
 select.style.display='block';$('modalInput').style.display='none';
 $('modalTitle').textContent='نقل «'+item.name+'» إلى';
 $('modalBack').style.display='flex';
 $('modalOk').textContent='نقل';
 modalAction=destination=>{
  item.parent=destination;item.updated=Date.now();save();
  if(mode==='files' && folder!== 'root' && !byId(folder)) folder='root';
  render();notify('تم نقل العنصر');
 };
 $('modalInput').value='__move__';
 $('modalOk').onclick=()=>{const dest=select.value;modalAction?.(dest);closeModal()};
}
function removeItem(fid){const f=byId(fid);if(!f)return;if(!confirm('حذف «'+f.name+'»؟'+(f.type==='folder'?' سيتم حذف محتوياته أيضاً.':'')))return;let ids=[fid];for(let i=0;i<ids.length;i++)data.filter(x=>x.parent===ids[i]).forEach(x=>ids.push(x.id));data=data.filter(x=>!ids.includes(x.id));save();render();notify('تم الحذف')}
function createFolder(){showModal('مجلد جديد','اسم المجلد',n=>{add('folder',n);notify('تم إنشاء المجلد')})}
function createFile(){showModal('ملف HTML جديد','اسم الملف (مثلاً page.html)',n=>{if(!/\.html?$/i.test(n))n+='.html';const f=add('file',n,folder,starter);openFile(f.id)})}
function importFile(file){const reader=new FileReader();reader.onload=()=>{const f=add('file',file.name,folder,String(reader.result));openFile(f.id);notify('تم استيراد الملف')};reader.readAsText(file)}
$('newMenu').onclick=()=>{$('newMenuPopup').style.display=$('newMenuPopup').style.display==='block'?'none':'block'};$('newFolderMenu').onclick=()=>{$('newMenuPopup').style.display='none';createFolder()};$('newFileMenu').onclick=()=>{$('newMenuPopup').style.display='none';createFile()};$('importMenu').onclick=()=>{$('newMenuPopup').style.display='none';$('filePicker').click()};
$('newFolder').onclick=createFolder;$('newFile').onclick=createFile;
$('mobileNav').onclick=()=>{document.querySelector('.sidebar').classList.toggle('mobile-open')};
$('homeNav').onclick=()=>{mode='files';folder='root';setNav('homeNav');document.querySelector('.sidebar').classList.remove('mobile-open');render()};
$('recentNav').onclick=()=>{mode='recent';setNav('recentNav');document.querySelector('.sidebar').classList.remove('mobile-open');render()};
$('starNav').onclick=()=>{mode='star';setNav('starNav');document.querySelector('.sidebar').classList.remove('mobile-open');render()};
function setNav(id){['homeNav','recentNav','starNav'].forEach(x=>$(x).classList.toggle('active',x===id))}
$('search').oninput=render;$('sort').onchange=render;
$('viewToggle').onclick=()=>{list=!list;render()};
$('importTop').onclick=()=>$('filePicker').click();
$('filePicker').onchange=e=>{if(e.target.files[0])importFile(e.target.files[0]);e.target.value=''};
$('closeViewer').onclick=()=>{saveOpened(false);$('viewer').style.display='none';render()};
$('showPreview').onclick=()=>setView('preview');$('showCode').onclick=()=>setView('code');$('showSplit').onclick=()=>setView('split');
$('saveCode').onclick=saveOpened;$('exportOpen').onclick=exportOpened;
$('openCode').oninput=()=>{clearTimeout(window._previewTimer);clearTimeout(window._autosaveTimer);$('viewStatus').textContent='تعديلات غير محفوظة';window._previewTimer=setTimeout(()=>{if(view!=='code')run()},500);window._autosaveTimer=setTimeout(()=>{saveOpened(false);$('viewStatus').textContent='حُفظت التعديلات تلقائياً'},1100)};
$('modalOk').onclick=modalOk;$('modalCancel').onclick=closeModal;$('modalInput').onkeydown=e=>{if(e.key==='Enter')modalOk();if(e.key==='Escape')closeModal()};
document.addEventListener('click',e=>{if(!$('context').contains(e.target))$('context').style.display='none'});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('viewer').style.display==='flex')$('viewer').style.display='none';if((e.ctrlKey||e.metaKey)&&e.key==='s'&&$('viewer').style.display==='flex'){e.preventDefault();saveOpened()}});
try{data=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){data=[]}
if(!Array.isArray(data))data=[];
// ===== نسخ احتياطي / استعادة =====
function backupAll(){const blob=new Blob([JSON.stringify({app:'masahati',version:1,exported:Date.now(),data},null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);const d=new Date().toISOString().slice(0,10);a.download='masahati-backup-'+d+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);notify('تم تصدير النسخة الاحتياطية')}
function restoreAll(file){const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(String(r.result));const arr=Array.isArray(j)?j:j.data;if(!Array.isArray(arr)||arr.some(x=>!x||!x.id||!x.type||!x.name))throw 0;if(!confirm('سيتم استبدال جميع الملفات الحالية ('+data.length+' عنصر) بمحتوى النسخة ('+arr.length+' عنصر). المتابعة؟'))return;data=arr;folder='root';mode='files';setNav('homeNav');save();render();notify('تمت الاستعادة بنجاح')}catch(e){notify('ملف النسخة الاحتياطية غير صالح')}};r.readAsText(file)}
$('backupMenu').onclick=()=>{$('newMenuPopup').style.display='none';backupAll()};
$('restoreMenu').onclick=()=>{$('newMenuPopup').style.display='none';$('restorePicker').click()};
$('restorePicker').onchange=e=>{if(e.target.files[0])restoreAll(e.target.files[0]);e.target.value=''};
// ===== التثبيت والعمل دون إنترنت =====
let installEvt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;$('installMenu').style.display='block'});
window.addEventListener('appinstalled',()=>{installEvt=null;$('installMenu').style.display='none';notify('تم تثبيت التطبيق')});
$('installMenu').onclick=async()=>{$('newMenuPopup').style.display='none';if(!installEvt)return;installEvt.prompt();await installEvt.userChoice;installEvt=null;$('installMenu').style.display='none'};
if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(()=>{})}
if('serviceWorker' in navigator&&location.protocol!=='file:'){window.addEventListener('load',()=>{navigator.serviceWorker.register('service-worker.js').then(()=>{if(!navigator.onLine)return;navigator.serviceWorker.ready.then(()=>{if(!localStorage.getItem('masahati-offline-ready')){localStorage.setItem('masahati-offline-ready','1');notify('التطبيق جاهز للعمل دون إنترنت')}})}).catch(()=>{})})}
render();
})();
</script>
